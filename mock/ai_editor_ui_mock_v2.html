<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIチップエディタ（見た目モック v2）</title>
  <style>
    :root{
      /* ===== 調整ポイント ===== */
      --cell: 68px;     /* チップ紙面のサイズ */
      --gap: 16px;      /* チップ間の隙間（矢印が見えるスペース） */
      --radius: 14px;

      /* ===== ファンタジー配色（木・金・紙・溝） ===== */
      --bg0: #0a0810;
      --bg1: #1a1322;

      --wood0:#2a140c;
      --wood1:#3b1d12;
      --wood2:#5a2f1d;

      --gold0:#e6c57a;
      --gold1:#a87925;

      --groove0:#17131b;
      --groove1:#0b0910;

      --paper0:#efe0bf;
      --paper1:#d1b07f;

      --edge0:#2b2018;
      --ink:#2b2018;

      --arrowMain0:#4ff1da; /* 通常(青) */
      --arrowMain1:#0aa6a2;
      --arrowTrue0:#ff5a5a; /* True(赤) */
      --arrowTrue1:#b41414;
      --arrowFalse0:#59ff8f;/* False(緑) */
      --arrowFalse1:#1aa74b;

      --shadow: rgba(0,0,0,.55);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 800px at 25% 15%, #2a1a2e 0%, rgba(0,0,0,0) 60%),
        radial-gradient(900px 700px at 75% 40%, #103034 0%, rgba(0,0,0,0) 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      padding: 22px;
      overflow-x:auto;
      color: #f2e9dc;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
    }

    /* ===== 木枠 ===== */
    .editor{
      width: max-content;
      margin: 0 auto;
      border-radius: calc(var(--radius) + 10px);
      padding: 18px;
      position: relative;
      background:
        linear-gradient(145deg, rgba(255,255,255,.08), rgba(0,0,0,0) 35%),
        linear-gradient(180deg, var(--wood2), var(--wood0));
      box-shadow:
        0 26px 60px var(--shadow),
        inset 0 0 0 2px rgba(230,197,122,.18),
        inset 0 0 0 10px rgba(0,0,0,.25);
    }
    .editor::before{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: calc(var(--radius) + 6px);
      box-shadow: inset 0 0 0 2px rgba(230,197,122,.18);
      pointer-events:none;
    }

    /* START刻印（木枠側） */
    .startPlaque{
      position:absolute;
      left: 18px;
      top: 18px;
      padding: 10px 12px;
      border-radius: 12px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.10), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, #4b2a1a, #2a140c);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12),
        0 10px 18px rgba(0,0,0,.35);
      color: rgba(230,197,122,.95);
      font-weight: 900;
      letter-spacing: .14em;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
      user-select:none;
    }

    /* ===== 盤面（溝） ===== */
    .grid{
      margin-top: 56px; /* START刻印分だけ下げる */
      padding: var(--gap);
      border-radius: calc(var(--radius) + 6px);
      display:grid;
      grid-template-columns: repeat(13, var(--cell));
      grid-template-rows: repeat(13, var(--cell));
      gap: var(--gap);
      background:
        radial-gradient(140px 110px at 25% 25%, rgba(79,241,218,.08), rgba(0,0,0,0) 60%),
        radial-gradient(170px 120px at 70% 40%, rgba(255,90,90,.06), rgba(0,0,0,0) 65%),
        repeating-linear-gradient(90deg,
          rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 2px,
          rgba(0,0,0,0) 2px, rgba(0,0,0,0) 10px),
        linear-gradient(180deg, var(--groove0), var(--groove1));
      box-shadow:
        inset 0 0 0 2px rgba(230,197,122,.12),
        inset 0 10px 24px rgba(0,0,0,.35);
      overflow: visible;
    }

    /* ===== 1マス（チップの置き場） ===== */
    .slot{
      position:relative;
      overflow: visible; /* 矢印三角が隙間へはみ出せる */
      width: var(--cell);
      height: var(--cell);
    }

    /* ===== チップ本体（紙） ===== */
    .chip{
      position:absolute;
      inset: 0;
      border-radius: var(--radius);
      background:
        /* 紙のムラ */
        radial-gradient(40px 30px at 20% 25%, rgba(255,255,255,.22), rgba(0,0,0,0) 60%),
        radial-gradient(55px 40px at 70% 60%, rgba(0,0,0,.08), rgba(0,0,0,0) 70%),
        linear-gradient(145deg, rgba(255,255,255,.18), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, var(--paper0), var(--paper1));
      box-shadow:
        0 10px 18px rgba(0,0,0,.35),
        inset 0 0 0 2px rgba(0,0,0,.40),
        inset 0 1px 0 rgba(255,255,255,.16);
      display:grid;
      place-items:center;
      padding: 8px;
      color: var(--ink);
      user-select:none;
    }

    /* ちょい焦げ縁 */
    .chip::after{
      content:"";
      position:absolute;
      inset: 2px;
      border-radius: calc(var(--radius) - 2px);
      box-shadow:
        inset 0 0 0 2px rgba(43,32,24,.22);
      pointer-events:none;
      opacity:.75;
    }

    /* 種類：空（置けない/壁扱いなどの表現） */
    .chip.is-empty{
      background:
        linear-gradient(145deg, rgba(255,255,255,.06), rgba(0,0,0,0) 55%),
        linear-gradient(180deg, #2b2731, #17141c);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.55),
        inset 0 12px 18px rgba(0,0,0,.35);
      color: rgba(255,255,255,.15);
    }

    /* 選択表示（見た目だけ） */
    .chip.is-selected{
      outline: 3px solid rgba(230,197,122,.9);
      box-shadow:
        0 0 0 3px rgba(0,0,0,.25),
        0 18px 28px rgba(0,0,0,.35),
        0 0 18px rgba(230,197,122,.24),
        inset 0 0 0 2px rgba(0,0,0,.40),
        inset 0 1px 0 rgba(255,255,255,.16);
    }

    /* ===== 中身レイアウト ===== */
    .content{
      width: 100%;
      height: 100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 6px;
    }

    /* 行動チップ：中央アイコンのみ */
    .content.action{ gap: 0; }
    .glyph{
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
    }
    .glyph path, .glyph rect, .glyph circle, .glyph line, .glyph polyline, .glyph polygon{
      stroke: #2b2018;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: rgba(255,200,110,.22); /* ほんのり金 */
    }

    /* 条件チップ：アイコン＋距離/存在(E) */
    .label{
      font-weight: 900;
      letter-spacing: .04em;
      font-size: 18px;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,.30);
    }
    .label.small{
      font-size: 16px;
    }

    /* NOP：横棒 */
    .nopMark{
      width: 32px;
      height: 8px;
      border-radius: 6px;
      background: rgba(43,32,24,.85);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 2px 0 rgba(0,0,0,.22);
    }

    /* ===== 矢印（三角アイコン） ===== */
    .tri{
      position:absolute;
      width: 16px;
      height: 18px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.35));
      pointer-events:none;
    }

    /* 三角の下地プレート（暗いレールっぽく） */
    .tri::before{
      content:"";
      position:absolute;
      inset: -6px -8px;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(25,20,28,.85), rgba(10,8,16,.85));
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.50),
        inset 0 1px 0 rgba(255,255,255,.06);
      opacity: .95;
    }

    .tri i{
      position:absolute;
      inset: 0;
      display:block;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.20);
    }
    .tri.main i{ background: linear-gradient(180deg, var(--arrowMain0), var(--arrowMain1)); }
    .tri.true i{ background: linear-gradient(180deg, var(--arrowTrue0), var(--arrowTrue1)); }
    .tri.false i{ background: linear-gradient(180deg, var(--arrowFalse0), var(--arrowFalse1)); }

    /* 右（→） */
    .tri.r{
      left: 100%;
      top: 50%;
      transform: translate(calc(var(--gap)/2 - 2px), -50%);
    }
    /* 左（←） */
    .tri.l{
      right: 100%;
      top: 50%;
      transform: translate(calc(-1 * (var(--gap)/2 - 2px)), -50%) rotate(180deg);
      transform-origin:center;
    }
    /* 下（↓） */
    .tri.d{
      left: 50%;
      top: 100%;
      transform: translate(-50%, calc(var(--gap)/2 - 2px)) rotate(90deg);
      transform-origin:center;
    }
    /* 上（↑） */
    .tri.u{
      left: 50%;
      bottom: 100%;
      transform: translate(-50%, calc(-1 * (var(--gap)/2 - 2px))) rotate(-90deg);
      transform-origin:center;
    }
  </style>
</head>

<body>
  <div class="editor">
    <div class="startPlaque">START</div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const W = 13, H = 13;

    /* ===== アイコン（簡易SVG） ===== */
    const SVG = {
      sword: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M30 8l10 10-16 16-6 2 2-6z"/>
          <path d="M18 30l-7 7"/>
          <path d="M14 37l-3 3"/>
          <path d="M20 28l4 4"/>
          <path d="M27 21l4 4"/>
        </svg>`,
      shield: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 6l14 6v12c0 10-6 16-14 18C16 40 10 34 10 24V12z"/>
          <path d="M24 12v26"/>
        </svg>`,
      boot: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M18 10v12c0 4 3 7 7 7h11v8H14c-4 0-6-3-6-6V18"/>
          <path d="M18 14h6"/>
        </svg>`,
      chest: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="10" y="18" width="28" height="20" rx="4" />
          <path d="M10 24h28"/>
          <path d="M22 18v-4h4v4"/>
          <path d="M24 24v6"/>
        </svg>`,
      skull: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 10c-8 0-14 6-14 14 0 6 3 10 8 12v6h12v-6c5-2 8-6 8-12 0-8-6-14-14-14z"/>
          <circle cx="19" cy="24" r="2.5"/>
          <circle cx="29" cy="24" r="2.5"/>
          <path d="M22 31h4"/>
        </svg>`,
      target: () => `
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="14"/>
          <circle cx="24" cy="24" r="7"/>
          <path d="M24 10v6"/>
          <path d="M24 32v6"/>
          <path d="M10 24h6"/>
          <path d="M32 24h6"/>
        </svg>`
    };

    /* ===== チップ定義（見た目サンプル） =====
       - type: "action" | "cond" | "nop" | "empty"
       - icon: SVGキー
       - label: "20M" / "E" など（条件のみ）
       - arrows: [{dir:"r|l|u|d", kind:"main|true|false"}] */
    const chips = new Map([
      ["0,0", { type:"nop", arrows:[{dir:"r", kind:"main"}] }], // START地点（木枠に刻印。チップ自体はNOP例）
      ["2,1", { type:"action", icon:"sword", arrows:[{dir:"r", kind:"main"},{dir:"d", kind:"true"},{dir:"l", kind:"false"}] }],
      ["4,3", { type:"action", icon:"shield", arrows:[{dir:"d", kind:"main"}] }],
      ["6,5", { type:"action", icon:"boot", arrows:[{dir:"r", kind:"main"}] }],
      ["8,5", { type:"action", icon:"target", arrows:[{dir:"d", kind:"true"}] }], // MoveTo例（中央アイコンのみ）
      ["7,7", { type:"cond", icon:"chest", label:"E", arrows:[{dir:"r", kind:"true"},{dir:"d", kind:"false"}] }],
      ["9,7", { type:"cond", icon:"skull", label:"75M", arrows:[{dir:"r", kind:"main"}] }],
      ["10,9",{ type:"cond", icon:"chest", label:"20M", arrows:[{dir:"u", kind:"main"}] }],
      ["7,6", { type:"nop", selected:true, arrows:[{dir:"r", kind:"main"}] }]
    ]);

    // 右下を少し空洞にして雰囲気づくり
    function isEmpty(x,y){
      return (x >= 11 && y >= 9);
    }

    function tri(dir, kind){
      const el = document.createElement("span");
      el.className = `tri ${dir} ${kind}`;
      el.innerHTML = `<i></i>`;
      return el;
    }

    function buildChip(x,y){
      const slot = document.createElement("div");
      slot.className = "slot";

      const chip = document.createElement("div");
      chip.className = "chip";

      if (isEmpty(x,y)){
        chip.classList.add("is-empty");
        slot.appendChild(chip);
        return slot;
      }

      const key = `${x},${y}`;
      const data = chips.get(key) ?? { type:"nop" };

      if (data.selected) chip.classList.add("is-selected");

      const content = document.createElement("div");
      content.className = "content";

      if (data.type === "action"){
        content.classList.add("action");
        content.innerHTML = SVG[data.icon]?.() ?? SVG.target();
      } else if (data.type === "cond"){
        content.innerHTML = `
          ${SVG[data.icon]?.() ?? SVG.chest()}
          <div class="label">${data.label ?? "E"}</div>
        `;
      } else if (data.type === "nop"){
        content.innerHTML = `<div class="nopMark" aria-hidden="true"></div>`;
      } else {
        chip.classList.add("is-empty");
      }

      chip.appendChild(content);
      slot.appendChild(chip);

      (data.arrows ?? []).forEach(a=>{
        slot.appendChild(tri(a.dir, a.kind));
      });

      return slot;
    }

    // 13x13 生成
    for (let y=0;y<H;y++){
      for (let x=0;x<W;x++){
        grid.appendChild(buildChip(x,y));
      }
    }
  </script>
</body>
</html>
